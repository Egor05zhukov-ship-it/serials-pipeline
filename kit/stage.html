<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: Mont; font-weight: 800; src: url(/fonts/Montserrat-ExtraBold.ttf); }
  @font-face { font-family: Mont; font-weight: 600; src: url(/fonts/Montserrat-SemiBold.ttf); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  svg { display: block; }
</style>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<script type="module">
  import { frame, cover } from '/kit/index.js';
  const q = new URLSearchParams(location.search);
  const ep = (await import(q.get('ep'))).default;
  const tl = await (await fetch(q.get('tl'))).json();
  const stage = document.getElementById('stage');
  window.seek = (t) => { stage.innerHTML = frame(ep, tl, t); };
  window.cover = () => { stage.innerHTML = cover(ep.cover); };
  await Promise.all([document.fonts.load('800 60px Mont', 'АЯ'), document.fonts.load('600 40px Mont', 'АЯ')]);
  window.ready = true;
</script>
