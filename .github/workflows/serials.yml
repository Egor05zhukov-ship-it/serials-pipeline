name: serials
on:
  workflow_dispatch:
    inputs:
      task:
        description: "probe, build or sync"
        default: "sync"
      arg:
        description: "build: episode files, space-separated (empty = every episode with status written)"
        default: ""
  push:
    branches: [main]
    paths: ["series/**/ep*.js"]
  schedule:
    - cron: "41 6,15 * * *"
permissions:
  contents: write
concurrency:
  group: serials-${{ github.event_name == 'schedule' && 'sync' || inputs.task || 'build' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      TASK: ${{ github.event_name == 'schedule' && 'sync' || inputs.task || 'build' }}
      ARG: ${{ inputs.arg }}
      QWEN_SIZE: ${{ vars.QWEN_SIZE }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: env.TASK == 'build'
        with:
          python-version: "3.12"
      - run: bash ci/run.sh
      - uses: actions/upload-artifact@v4
        if: always() && env.TASK != 'sync'
        with:
          name: out-${{ github.run_number }}
          path: |
            out/*/video.mp4
            out/*/cover.jpg
            out/*/contact.jpg
            out/*/caption.txt
            ci-report.txt
            build.log
          if-no-files-found: ignore
          retention-days: 5
